<app-sortable-table
  [columns]="columns"
  [rows]="projectReports()"
  [trackBy]="trackBy"
  [cellTemplates]="{
    project: projectCell,
    duration: durationCell,
  }"
>
  <ng-template #projectCell let-projectReport>
    <span
      class="project-name"
      [class.project-name--archived]="projectReport.project.isArchived"
      [style.--project-color]="projectReport.project.color"
    >{{ projectReport.project.name }}</span>
  </ng-template>
  <ng-template #durationCell let-projectReport>
    {{ projectReport.trackedTimeMillis | msToHHMMSS }}
  </ng-template>
</app-sortable-table>
