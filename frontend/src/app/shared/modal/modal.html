<div class="modal__backdrop" (click)="onBackdropClick($event)">
  <div
    class="modal__card"
    [class.modal__card--sm]="size() === 'sm'"
    [class.modal__card--md]="size() === 'md'"
    [class.modal__card--lg]="size() === 'lg'"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="ariaLabel() || header() || null"
  >
    <div class="modal__header">
      <h1 class="modal__title">
        @if (header()) {
          {{ header() }}
        } @else {
          <ng-content select="[modalTitle]" />
        }
      </h1>
      <button type="button" class="modal__close" (click)="close()" aria-label="Close">
        &times;
      </button>
    </div>
    <ng-content />
  </div>
</div>
