<app-modal [header]="header()" (closeEvent)="close()">
	<div class="delete-confirmation-modal__actions">
		<button type="button" class="delete-confirmation-modal__button delete-confirmation-modal__button--delete" (click)="confirmationOptionSelectEvent.emit(true)">{{ confirmLabel() }}</button>
		<button type="button" class="delete-confirmation-modal__button delete-confirmation-modal__button--cancel" (click)="confirmationOptionSelectEvent.emit(false)" i18n>Cancel</button>
	</div>
</app-modal>
