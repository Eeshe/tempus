<div class="selector">
	<button #triggerButton
	        type="button"
	        class="selector__trigger"
	        [class.selector__trigger--open]="isOpen()"
	        aria-haspopup="dialog"
	        [attr.aria-expanded]="isOpen()"
	        (click)="toggle()"
	>
		<span i18n>Billable</span>
		@if (isBillable() === null) {
		<span class="selector__indicator--all">-</span>
		} @else {
		<span class="selector__indicator"
		      [class.selector__indicator--yes]="isBillable() === true"
		      [class.selector__indicator--no]="isBillable() === false"
		      aria-hidden="true"
		>{{ symbol() }}</span>
		}
	</button>

	<div #popup class="selector__popup"
	     [class.selector__popup--open]="isOpen()"
	     [class.selector__popup--above]="opensAbove()"
	     [style.top.px]="popupPosition().top"
	     [style.left.px]="popupPosition().left"
	>
		<div class="selector__popup-list" role="group" aria-label="Billable" i18n-aria-label>
			<button type="button"
			        class="selector__popup-option"
			        [class.selector__popup-option--selected]="isSelected(null)"
			        (click)="select(null)"
			>
				<span class="selector__popup-name" i18n>All</span>
				<span class="selector__popup-check"></span>
			</button>

			<button type="button"
			        class="selector__popup-option"
			        [class.selector__popup-option--selected]="isSelected(true)"
			        (click)="select(true)"
			>
				<span class="selector__popup-name" i18n>Yes</span>
				<span class="selector__popup-check"></span>
			</button>

			<button type="button"
			        class="selector__popup-option"
			        [class.selector__popup-option--selected]="isSelected(false)"
			        (click)="select(false)"
			>
				<span class="selector__popup-name" i18n>No</span>
				<span class="selector__popup-check"></span>
			</button>
		</div>
	</div>
</div>
