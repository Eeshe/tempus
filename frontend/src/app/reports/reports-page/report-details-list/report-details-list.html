<header class="total-header">
  <span class="total-header__label">TOTAL</span>
  <span class="total-header__value">{{ formattedTotalTrackedTime() }}</span>

  <span class="total-header__label">BILLABLE</span>
  <span class="total-header__value">{{ formattedTotalBillableTrackedTime() }}</span>

  <span class="total-header__label">NON-BILLABLE</span>
  <span class="total-header__value">{{ formattedTotalNonBillableTrackedTime() }}</span>

  <span class="total-header__label">ACCUMULATED PAY</span>
  <span class="total-header__value">USD{{ formattedTotalAccumulatedPay() }}</span>
</header>
<div class="details-container">
  <app-sortable-table
    [columns]="columns"
    [rows]="reportEntries()"
    [trackBy]="trackBy"
    [cellTemplates]="{ project: projectCell, duration: durationCell }"
  >
    <ng-template #projectCell let-entry>
      <span
        class="project-name"
        [class.project-name--archived]="entry.project.isArchived"
        [style.--project-color]="entry.project.color"
      >{{ entry.project.name }}</span>
    </ng-template>
    <ng-template #durationCell let-entry>
      {{ entry.trackedTimeMillis | msToHHMMSS }}
    </ng-template>
  </app-sortable-table>
</div>
