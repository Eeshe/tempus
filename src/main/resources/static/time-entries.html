<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Entries | Tempus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <span class="brand">Tempus</span>
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="time-entries.html">Time Entries</a>
    <span class="spacer"></span>
    <button class="secondary" id="logout-btn">Log out</button>
  </nav>

  <div class="container">
    <h1>Time Entries</h1>

    <section>
      <h2>Create Time Entry</h2>
      <div class="form-panel">
        <form id="create-form" class="form-row">
          <div>
            <label for="create-project">Project</label>
            <select id="create-project" required></select>
          </div>
          <div>
            <label for="create-user">User</label>
            <select id="create-user" required></select>
          </div>
          <div>
            <label for="create-task">Task ID (optional)</label>
            <input type="number" id="create-task">
          </div>
          <div>
            <label for="create-group">Group ID (optional)</label>
            <input type="number" id="create-group">
          </div>
          <div>
            <label for="create-description">Description</label>
            <textarea id="create-description" rows="2" placeholder="Optional"></textarea>
          </div>
          <div>
            <label for="create-start">Start Time</label>
            <input type="datetime-local" id="create-start" required>
          </div>
          <div>
            <label for="create-end">End Time (optional)</label>
            <input type="datetime-local" id="create-end">
          </div>
          <div>
            <label class="inline-field">
              <input type="checkbox" id="create-billable"> Billable
            </label>
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="submit">Create</button>
          </div>
        </form>
        <div class="error" id="create-error"></div>
        <div class="success" id="create-success"></div>
      </div>
    </section>

    <section>
      <h2>Time Entry List</h2>
      <div class="status" id="status">Loading time entries...</div>
      <table id="entries-table" class="compact" style="display:none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Project</th>
            <th>User</th>
            <th>Task</th>
            <th>Billable</th>
            <th>Start</th>
            <th>End</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="entries-body"></tbody>
      </table>
    </section>

    <section id="patch-section" style="display:none;">
      <h2>Patch Time Entry</h2>
      <div class="form-panel">
        <p class="muted" id="patch-target"></p>
        <form id="patch-form" class="form-row">
          <div>
            <label for="patch-project">Project</label>
            <select id="patch-project"></select>
          </div>
          <div>
            <label for="patch-description">Description</label>
            <input type="text" id="patch-description" placeholder="Leave empty to keep">
          </div>
          <div>
            <label for="patch-task">Task ID</label>
            <input type="number" id="patch-task" placeholder="Empty = unchanged">
          </div>
          <div>
            <label for="patch-group">Group ID</label>
            <input type="number" id="patch-group" placeholder="Empty = unchanged">
          </div>
          <div>
            <label for="patch-start">Start Time</label>
            <input type="datetime-local" id="patch-start">
          </div>
          <div>
            <label for="patch-end">End Time</label>
            <input type="datetime-local" id="patch-end">
          </div>
          <div>
            <label>
              <input type="checkbox" id="patch-billable"> Billable
            </label>
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="submit">Save</button>
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="button" class="secondary" id="patch-cancel">Cancel</button>
          </div>
        </form>
        <div class="error" id="patch-error"></div>
        <div class="success" id="patch-success"></div>
      </div>
    </section>
  </div>

  <script src="common.js"></script>
  <script>
    let users = [];
    let projects = [];
    let entries = [];
    let patchId = null;
    let patchCurrent = null;

    function fillSelect(el, data, labelFn) {
      el.innerHTML = data.map(item =>
        '<option value="' + item.id + '">' + escapeHtml(labelFn(item)) + '</option>'
      ).join('');
    }

    async function renderSelects() {
      fillSelect(document.getElementById('create-project'), projects,
        p => p.name + ' (id ' + p.id + ')');
      fillSelect(document.getElementById('create-user'), users,
        u => 'User ' + u.id);
    }

    async function reload() {
      const [proj, usr, ent] = await Promise.all([
        loadProjects(), loadUsers(), api('/time-entries')
      ]);
      projects = proj;
      users = usr;
      entries = ent;
    }

    function renderEntries() {
      const body = document.getElementById('entries-body');
      body.innerHTML = entries.map(entry => `
        <tr>
          <td>${entry.id}</td>
          <td>${fmtNullable(entry.description)}</td>
          <td>${entry.projectId}</td>
          <td>${entry.userId}</td>
          <td>${fmtNullable(entry.taskId)}</td>
          <td>${fmtBool(entry.isBillable)}</td>
          <td>${fmtDateTime(entry.startTime)}</td>
          <td>${fmtDateTime(entry.endTime)}</td>
          <td><button class="secondary patch-btn" data-id="${entry.id}" title="button">Patch</button></td>
        </tr>
      `).join('');

      document.getElementById('status').textContent = entries.length
        ? 'Loaded ' + entries.length + ' time entr' + (entries.length === 1 ? 'y' : 'ies') + '.'
        : 'No time entries found.';
      document.getElementById('entries-table').style.display = 'block';

      document.querySelectorAll('.patch-btn').forEach(btn => {
        btn.addEventListener('click', () => openPatch(Number(btn.dataset.id)));
      });
    }

    document.getElementById('create-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errEl = document.getElementById('create-error');
      const okEl = document.getElementById('create-success');
      errEl.textContent = '';
      okEl.textContent = '';

      const body = {
        userId: Number(document.getElementById('create-user').value),
        projectId: Number(document.getElementById('create-project').value),
        isBillable: document.getElementById('create-billable').checked,
        startTime: document.getElementById('create-start').value
      };

      const taskId = document.getElementById('create-task').value.trim();
      const groupId = document.getElementById('create-group').value.trim();
      const description = document.getElementById('create-description').value.trim();
      const endTime = document.getElementById('create-end').value;

      if (taskId !== '') body.taskId = Number(taskId);
      if (groupId !== '') body.groupId = Number(groupId);
      if (description !== '') body.description = description;
      if (endTime !== '') body.endTime = endTime;

      try {
        await api('/time-entries', { method: 'POST', body });
        okEl.textContent = 'Time entry created.';
        document.getElementById('create-form').reset();
        await reload();
        renderSelects();
        renderEntries();
      } catch (err) {
        errEl.textContent = err.message;
      }
    });

    function openPatch(id) {
      patchId = id;
      patchCurrent = entries.find(en => en.id === id);
      document.getElementById('patch-target').textContent =
        'Updating time entry ' + id + ' (currently project ' + patchCurrent.projectId + ')';

      document.getElementById('patch-project').innerHTML = projects
        .map(p => '<option value="' + p.id + '"' + (p.id === patchCurrent.projectId ? ' selected' : '') + '>'
          + escapeHtml(p.name) + ' (id ' + p.id + ')</option>').join('');

      document.getElementById('patch-description').value = '';
      document.getElementById('patch-task').value = '';
      document.getElementById('patch-group').value = '';
      document.getElementById('patch-start').value = '';
      document.getElementById('patch-end').value = '';
      document.getElementById('patch-billable').checked = patchCurrent.isBillable;

      document.getElementById('patch-error').textContent = '';
      document.getElementById('patch-success').textContent = '';
      document.getElementById('patch-section').style.display = 'block';
      document.getElementById('patch-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('patch-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errEl = document.getElementById('patch-error');
      const okEl = document.getElementById('patch-success');
      errEl.textContent = '';
      okEl.textContent = '';

      const body = {};
      const description = document.getElementById('patch-description').value.trim();
      const taskId = document.getElementById('patch-task').value.trim();
      const groupId = document.getElementById('patch-group').value.trim();
      const startTime = document.getElementById('patch-start').value;
      const endTime = document.getElementById('patch-end').value;
      const newBillable = document.getElementById('patch-billable').checked;

      const newProjectId = Number(document.getElementById('patch-project').value);
      if (newProjectId !== patchCurrent.projectId) body.projectId = newProjectId;
      if (description !== '') body.description = description;
      if (taskId !== '') body.taskId = Number(taskId);
      if (groupId !== '') body.groupId = Number(groupId);
      if (startTime !== '') body.startTime = startTime;
      if (endTime !== '') body.endTime = endTime;
      if (newBillable !== patchCurrent.isBillable) body.isBillable = newBillable;

      try {
        await api('/time-entries/' + patchId, { method: 'PATCH', body });
        okEl.textContent = 'Time entry updated.';
        document.getElementById('patch-form').reset();
        document.getElementById('patch-section').style.display = 'none';
        await reload();
        renderEntries();
      } catch (err) {
        errEl.textContent = err.message;
      }
    });

    document.getElementById('patch-cancel').addEventListener('click', () => {
      document.getElementById('patch-section').style.display = 'none';
    });

    document.getElementById('logout-btn').addEventListener('click', logout);

    (async function init() {
      try {
        await reload();
        renderSelects();
        renderEntries();
      } catch (err) {
        document.getElementById('status').textContent = err.message;
      }
    })();
  </script>
</body>
</html>
