<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 2rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #333; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      margin-top: 1.5rem;
    }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f0f2f7; color: #555; font-size: .85rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    code {
      background: #eef1f7;
      padding: .25rem .5rem;
      border-radius: 6px;
      font-size: .85rem;
    }
    #status { margin-top: 1rem; font-size: .9rem; color: #888; }
    .raw {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, monospace;
      font-size: .8rem;
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    .actions { margin-top: 1.5rem; }
    .actions button {
      padding: .55rem 1rem;
      background: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
    }
    .actions button:hover { background: #3b59d6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Users</h1>
    <div id="status">Loading users...</div>
    <table id="users-table" style="display:none;">
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="actions">
      <button id="logout-btn">Log out</button>
    </div>
  </div>

  <script>
    async function loadUsers() {
      const statusEl = document.getElementById('status');
      const table = document.getElementById('users-table');
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      statusEl.textContent = 'Loading users...';
      table.style.display = 'none';

      try {
        const res = await fetch('http://localhost:8080/api/v1/users', {
          credentials: 'include'
        });

        if (res.status === 401 || res.status === 403) {
          statusEl.textContent = 'Not authenticated. Please log in.';
          setTimeout(() => window.location.href = 'login.html', 1500);
          return;
        }

        if (!res.ok) {
          statusEl.textContent = 'Request failed (HTTP ' + res.status + ')';
          return;
        }

        const data = await res.json();
        renderRows(data);
        statusEl.textContent = 'Loaded ' + (Array.isArray(data) ? data.length : 1) + ' user(s).';
      } catch (err) {
        statusEl.textContent = 'Network error: ' + err.message;
      }
    }

    function renderRows(data) {
      const rows = Array.isArray(data) ? data : [data];
      if (!rows.length) {
        document.getElementById('status').textContent = 'No users returned.';
        return;
      }

      const headers = Array.from(new Set(rows.flatMap(r => Object.keys(r))));
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      thead.innerHTML = headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('');
      tbody.innerHTML = rows.map(row =>
        '<tr>' + headers.map(h => '<td>' + escapeHtml(JSON.stringify(row[h])) + '</td>').join('') + '</tr>'
      ).join('');
      document.getElementById('users-table').style.display = 'table';
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      window.location.href = 'login.html';
    });

    loadUsers();
  </script>
</body>
</html>
