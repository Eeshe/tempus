<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | Tempus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <span class="brand">Tempus</span>
    <a href="index.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="time-entries.html">Time Entries</a>
    <span class="spacer"></span>
    <button class="secondary" id="logout-btn">Log out</button>
  </nav>

  <div class="container">
    <h1>Users</h1>
    <div class="status" id="status">Loading users...</div>
    <table id="users-table" style="display:none;">
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script src="common.js"></script>
  <script>
    async function loadUsers() {
      const statusEl = document.getElementById('status');
      const table = document.getElementById('users-table');
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      statusEl.textContent = 'Loading users...';
      table.style.display = 'none';

      try {
        const data = await api('/users');
        const rows = Array.isArray(data) ? data : [data];

        statusEl.textContent = rows.length
          ? 'Loaded ' + rows.length + ' user(s).'
          : 'No users returned.';

        const headers = Array.from(new Set(rows.flatMap(r => Object.keys(r))));
        thead.innerHTML = headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('');
        tbody.innerHTML = rows.map(row =>
          '<tr>' + headers.map(h =>
            '<td>' + escapeHtml(JSON.stringify(row[h])) + '</td>').join('') + '</tr>'
        ).join('');
        table.style.display = 'table';
      } catch (err) {
        statusEl.textContent = err.message;
      }
    }

    document.getElementById('logout-btn').addEventListener('click', logout);
    loadUsers();
  </script>
</body>
</html>
